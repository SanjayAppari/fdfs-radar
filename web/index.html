<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FDFS Radar</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-2: #f0eee9;
    --border: #e3e0d8;
    --text: #1d1c1a;
    --muted: #6d6a63;
    --accent: #c2410c;
    --ok: #15803d;
    --ok-bg: #e7f6ec;
    --ok-border: #a7dcb8;
    --off: #8a867d;
    --off-bg: #f1efea;
    --warn: #b45309;
    --warn-bg: #fdf1e1;
    --bad: #b91c1c;
    --bad-bg: #fde8e8;
    --hot: #ea580c;
    --flash: rgba(234, 88, 12, 0.28);
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211; --surface: #1b1b19; --surface-2: #242421; --border: #33322e;
      --text: #ecebe7; --muted: #9c998f; --accent: #fb923c;
      --ok: #4ade80; --ok-bg: #12301d; --ok-border: #1f5a34;
      --off: #8d8a82; --off-bg: #222220;
      --warn: #fbbf24; --warn-bg: #3a2c0c; --bad: #f87171; --bad-bg: #3b1414;
      --hot: #fb923c; --flash: rgba(251, 146, 60, 0.3);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121211; --surface: #1b1b19; --surface-2: #242421; --border: #33322e;
    --text: #ecebe7; --muted: #9c998f; --accent: #fb923c;
    --ok: #4ade80; --ok-bg: #12301d; --ok-border: #1f5a34;
    --off: #8d8a82; --off-bg: #222220;
    --warn: #fbbf24; --warn-bg: #3a2c0c; --bad: #f87171; --bad-bg: #3b1414;
    --hot: #fb923c; --flash: rgba(251, 146, 60, 0.3);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .bar { display: flex; align-items: center; gap: 14px; padding: 12px 0; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  .venue { color: var(--muted); }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
  .pill.ok i { animation: pulse 2s infinite; }
  .pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  .pill.off { color: var(--off); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 12px; }

  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  nav.tabs .count { font-weight: 500; color: var(--muted); margin-left: 4px; font-size: 12px; }

  main.wrap { padding-top: 24px; padding-bottom: 60px; }
  [hidden] { display: none !important; }

  .venues { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .venuebtn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
  .venuebtn .c { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--off-bg); color: var(--off); }
  .venuebtn .c.ok { background: var(--ok-bg); color: var(--ok); }
  .venuebtn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .dates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: thin; }
  .datebtn { flex: 0 0 auto; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 8px 12px; cursor: pointer; min-width: 128px; box-shadow: var(--shadow); }
  .datebtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .datebtn .d { font-weight: 700; }
  .datebtn .s { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
  .tag.open { background: var(--ok-bg); color: var(--ok); }
  .tag.closed { background: var(--off-bg); color: var(--off); }
  .tag.down { background: var(--bad-bg); color: var(--bad); }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
  input[type="search"], input[type="text"] { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; min-width: 0; }
  input[type="search"]:focus, input[type="text"]:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 0; border-color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow); }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 12px; font-weight: 500; color: var(--muted); }

  .movie { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .movie > h2 { margin: 0; padding: 12px 16px; font-size: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .movie > h2 .sub { color: var(--muted); font-weight: 500; font-size: 13px; }
  .fmt { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .fmt:last-child { border-bottom: 0; }
  .fmt-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
  .fmt-head .name { font-weight: 600; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .badge.hot { color: var(--hot); border-color: color-mix(in srgb, var(--hot) 45%, transparent); background: color-mix(in srgb, var(--hot) 10%, transparent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; border: 1px solid var(--border); background: var(--off-bg); border-radius: 10px; padding: 7px 11px 7px; cursor: pointer; text-align: left; min-width: 118px; transition: transform .1s; }
  .chip:hover { transform: translateY(-1px); }
  .chip .t { font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
  .chip .t::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--off); }
  .chip .sc { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .chip.avail { background: var(--ok-bg); border-color: var(--ok-border); }
  .chip.avail .t::before { background: var(--ok); }
  .chip.hot { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hot) 70%, transparent); }
  .chip.hot .t::after { content: '🔥'; font-size: 12px; }
  .chip.edge { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .chip.edge .t::before { background: var(--warn); }
  .chip.pending { background: var(--surface); border-style: dashed; }
  .chip.pending .t::before { background: transparent; border: 1.5px solid var(--muted); width: 5px; height: 5px; }
  .chip .seatline { font-size: 11px; font-weight: 600; margin-top: 2px; white-space: nowrap; color: var(--muted); }
  .chip.avail .seatline { color: var(--ok); }
  .chip.edge .seatline { color: var(--warn); }
  .chip.flash { animation: flash 2.4s ease-out; }
  .chip.new::after { content: 'NEW'; position: absolute; top: -7px; right: -6px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 5px; }
  @keyframes flash { 0% { box-shadow: 0 0 0 6px var(--flash); } 100% { box-shadow: 0 0 0 0 transparent; } }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* Redis */
  .tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--surface-2); }
  tbody tr.sel td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  tbody tr.flash td { animation: rowflash 2.4s ease-out; }
  @keyframes rowflash { 0% { background: var(--flash); } 100% { background: transparent; } }
  td.key { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  td.val { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }
  td.ttl { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .col-type { width: 70px; } .col-ttl { width: 90px; } .col-key { width: 38%; }
  .kseg { color: var(--muted); } .kseg b { color: var(--text); font-weight: 600; }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -8px 0 32px rgba(0,0,0,.12); z-index: 30; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease; }
  .drawer.open { transform: none; }
  .drawer header { position: static; background: none; backdrop-filter: none; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .drawer h3 { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-all; flex: 1; }
  .drawer .body { overflow: auto; padding: 0 16px 24px; }
  pre.json { margin: 0; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .j-k { color: var(--accent); } .j-s { color: var(--ok); } .j-n { color: #2563eb; } .j-b { color: #7c3aed; } .j-z { color: var(--muted); }
  :root[data-theme="dark"] .j-n { color: #93c5fd; } :root[data-theme="dark"] .j-b { color: #c4b5fd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .j-n { color: #93c5fd; } :root:not([data-theme="light"]) .j-b { color: #c4b5fd; } }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-bottom: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .cats { width: 100%; margin: 6px 0 14px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--border); }
  .legend .l-ok { background: var(--ok-bg); border-color: var(--ok-border); }
  .legend .l-edge { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .legend .l-off { background: var(--off-bg); }
  .legend .l-pend { border-style: dashed; background: var(--surface); }

  .hall { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px 10px; margin: 6px 0 14px; overflow-x: auto; }
  .hrow { display: flex; align-items: center; gap: 6px; min-height: 13px; margin-bottom: 3px; }
  .hrow .lbl { width: 16px; flex: 0 0 16px; font: 600 10px/1 var(--mono); color: var(--muted); text-align: center; }
  .hrow.good .lbl { color: var(--ok); }
  .hrow .sts { display: flex; gap: 2px; flex-wrap: nowrap; }
  .st { width: 9px; height: 9px; border-radius: 2px; background: var(--border); flex: 0 0 9px; }
  .st.f { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ok); }
  .st.m { background: var(--ok); }
  .hrow .full { height: 6px; flex: 1; min-width: 120px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--border) 0 9px, transparent 9px 11px); opacity: .8; }
  .hrow.good { background: color-mix(in srgb, var(--ok) 6%, transparent); border-radius: 4px; }
  .hallgrid { display: grid; gap: 2px; justify-content: center; align-items: center; }
  .hallgrid .lbl { font: 600 10px/1 var(--mono); color: var(--muted); text-align: center; }
  .hallgrid .lbl.good { color: var(--ok); }
  .hallgrid .st { width: 100%; height: auto; aspect-ratio: 1; flex: none; }
  .screenbar { margin: 10px auto 0; width: 70%; height: 5px; border-radius: 0 0 50% 50%; background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .screenlbl { text-align: center; font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: .1em; }
  .note { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }

  /* Alerts */
  .alerts { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .alerts li { padding: 10px 14px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; }
  .alerts li:last-child { border-bottom: 0; }
  .alerts .when { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .k-new_show { color: var(--accent); } .k-middle_seats { color: var(--ok); } .k-avail_up { color: var(--ok); } .k-date_open { color: #2563eb; }

  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(140%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 40; transition: transform .25s; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
  .toast:not(.show) { opacity: 0; visibility: hidden; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .col-ttl, td.ttl, .col-type, td.type { display: none; }
    .col-key { width: 55%; }
    .bar { gap: 8px; }
    .venue { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><span class="dot"></span>FDFS Radar</div>
      <div class="venue" id="venue">—</div>
      <div class="spacer"></div>
      <span class="pill off" id="watcherPill" title="Watcher status"><i></i><span>Connecting</span></span>
      <span class="meta" id="lastPoll"></span>
      <span class="pill off" id="streamPill" title="Live stream to this page"><i></i><span>Stream</span></span>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="shows" aria-selected="true">Shows</button>
      <button role="tab" data-tab="redis" aria-selected="false">Redis<span class="count" id="keyCount"></span></button>
      <button role="tab" data-tab="alerts" aria-selected="false">Alerts<span class="count" id="alertCount"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-shows">
    <div class="venues" id="venues"></div>
    <div class="dates" id="dates"></div>
    <div class="toolbar">
      <input type="search" id="showSearch" placeholder="Filter movie, screen, format…" style="flex:1;max-width:320px" />
      <label><input type="checkbox" id="watchedOnly" checked /> Watched movies only</label>
      <label><input type="checkbox" id="availOnly" /> Middle seats only</label>
      <label><input type="checkbox" id="hotOnly" /> 🔥 Priority only</label>
    </div>
    <div class="stats" id="stats"></div>
    <div class="legend"><span><i class="l-ok"></i>Middle seats free</span><span><i class="l-edge"></i>Front / side seats only</span><span><i class="l-off"></i>Sold out / not bookable</span><span><i class="l-pend"></i>Bookable, seats not checked yet</span></div>
    <div id="movies"></div>
  </section>

  <section id="tab-redis" hidden>
    <div class="toolbar">
      <input type="text" id="pattern" value="fdfs:*" spellcheck="false" style="flex:1;max-width:340px;font-family:var(--mono);font-size:13px" />
      <input type="search" id="keyFilter" placeholder="Filter keys / values…" style="flex:1;max-width:260px" />
      <button class="iconbtn" id="reloadKeys">Refresh</button>
      <label><input type="checkbox" id="liveKeys" checked /> Live</label>
      <span class="meta" id="keysMeta"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th class="col-key">Key</th><th class="col-type">Type</th><th class="col-ttl">TTL</th><th>Value</th></tr></thead>
        <tbody id="keysBody"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-alerts" hidden>
    <ul class="alerts" id="alertsList"></ul>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h3 id="drawerTitle"></h3><button class="iconbtn" id="drawerClose">Close</button></header>
  <div class="body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('fdfs:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('fdfs:' + k, JSON.stringify(v)); } catch {} },
  };

  const state = {
    status: null,
    snapshots: [],
    seats: {},
    layouts: {},
    alerts: [],
    prevMiddle: new Map(),
    selectedDate: store.get('date', null),
    selectedVenue: store.get('venue', null),
    tab: store.get('tab', 'shows'),
    prevShows: new Map(),   // sessionKey -> availStatus (for flash)
    changed: new Set(),
    fresh: new Set(),
    keys: [],
    keyHashes: new Map(),
    changedKeys: new Set(),
    drawerKey: null,
  };

  // ---------- theme ----------
  const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  applyTheme(store.get('theme', null));
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next); store.set('theme', next);
  };

  // ---------- helpers ----------
  const prettyDate = (d) => {
    const dt = new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)));
    return { wd: dt.toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' }), dm: dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', timeZone: 'UTC' }) };
  };
  const ago = (iso) => {
    if (!iso) return '—';
    const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's ago';
    return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm ago';
  };
  const ttlText = (ms) => {
    if (ms === -1) return '∞';
    if (ms < 0) return '—';
    const s = Math.round(ms / 1000);
    if (s < 3600) return Math.round(s / 60) + 'm';
    if (s < 86400) return Math.round(s / 3600) + 'h';
    return Math.round(s / 86400) + 'd';
  };
  const showKey = (s) => s.source + ':' + s.venue + ':' + s.date + ':' + s.sessionId;
  const seatInfo = (s) => (s.availStatus === '0' ? null : state.seats[showKey(s)] || null);
  /** 'mid' | 'edge' | 'full' | 'pending' | 'off' */
  const seatState = (s) => {
    if (s.availStatus === '0') return 'off';
    const r = seatInfo(s);
    if (!r) return 'pending';
    if (r.layoutSource === 'unknown' && r.totalFree > 0) return 'unknown';
    if (r.middleOk) return 'mid';
    return r.totalFree > 0 ? 'edge' : 'full';
  };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  let toastTimer;
  const toast = (msg) => { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 4000); };

  // ---------- tabs ----------
  const setTab = (tab) => {
    state.tab = tab; store.set('tab', tab);
    document.querySelectorAll('nav.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    for (const t of ['shows', 'redis', 'alerts']) $('#tab-' + t).hidden = t !== tab;
    if (tab === 'redis') loadKeys();
  };
  document.querySelectorAll('nav.tabs button').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

  // ---------- status ----------
  const renderStatus = () => {
    const st = state.status;
    const pill = $('#watcherPill');
    if (!st) { pill.className = 'pill off'; pill.lastElementChild.textContent = 'No watcher data'; return; }
    const vs = st.venues || [];
    $('#venue').textContent = vs.length === 1 ? vs[0].name : `${vs.length} venues`;
    const jobs = vs.reduce((n, v) => n + (v.dates?.length || 0), 0) || 1;
    const maxGap = ((st.pollSeconds?.[1] ?? 90) + jobs * 6 + 180) * 1000;
    const stale = st.state === 'ok' && st.lastPollAt && Date.now() - Date.parse(st.lastPollAt) > maxGap;
    const map = { ok: ['ok', 'Live'], starting: ['warn', 'Starting'], blocked: ['bad', 'Blocked'], error: ['warn', 'Error'], stopped: ['off', 'Stopped'] };
    let [cls, label] = map[st.state] || ['off', st.state];
    if (stale) { cls = 'warn'; label = 'Stale'; }
    pill.className = 'pill ' + cls;
    pill.lastElementChild.textContent = label;
    pill.title = st.message ? st.message : 'Since ' + new Date(st.since).toLocaleString();
    $('#lastPoll').textContent = st.lastPollAt ? 'polled ' + ago(st.lastPollAt) : '';
  };

  // ---------- shows ----------
  const venueList = () => {
    const m = new Map();
    (state.status?.venues || []).forEach((v) => m.set(v.code, v.name));
    state.snapshots.forEach((s) => { if (!m.has(s.venue)) m.set(s.venue, s.venueName || s.venue); });
    return [...m].map(([code, name]) => ({ code, name }));
  };
  const allDates = () => {
    const v = (state.status?.venues || []).find((x) => x.code === state.selectedVenue);
    const set = new Set(v?.dates || []);
    state.snapshots.filter((s) => s.venue === state.selectedVenue).forEach((s) => set.add(s.date));
    return [...set].sort();
  };
  const snapFor = (date) => state.snapshots.find((s) => s.date === date && s.venue === state.selectedVenue);

  const renderVenues = () => {
    const vs = venueList();
    if (!vs.some((v) => v.code === state.selectedVenue)) state.selectedVenue = vs[0]?.code ?? null;
    $('#venues').hidden = vs.length < 2;
    $('#venues').innerHTML = vs.map((v) => {
      const mid = state.snapshots.filter((s) => s.venue === v.code && s.status === 'open')
        .reduce((n, s) => n + s.shows.filter((x) => x.watched && seatState(x) === 'mid').length, 0);
      return `<button class="venuebtn" data-v="${esc(v.code)}" aria-pressed="${v.code === state.selectedVenue}">${esc(v.name)}<span class="c ${mid ? 'ok' : ''}" title="Shows with free middle seats">${mid}</span></button>`;
    }).join('');
    document.querySelectorAll('.venuebtn').forEach((b) => (b.onclick = () => { state.selectedVenue = b.dataset.v; store.set('venue', b.dataset.v); renderShows(); }));
  };

  const renderDates = () => {
    const dates = allDates();
    if (!dates.includes(state.selectedDate)) state.selectedDate = dates[0] ?? null;
    $('#dates').innerHTML = dates.map((d) => {
      const s = snapFor(d);
      const { wd, dm } = prettyDate(d);
      const tag = !s ? '<span class="tag closed">waiting</span>'
        : s.status === 'open' ? '<span class="tag open">open</span>'
        : s.status === 'venue_down' ? '<span class="tag down">venue down</span>'
        : '<span class="tag closed">not open</span>';
      const watched = s ? s.shows.filter((x) => x.watched) : [];
      const mid = watched.filter((x) => seatState(x) === 'mid').length;
      const counts = s && s.status === 'open' ? `<span>${mid}/${watched.length} middle</span>` : '';
      return `<button class="datebtn" data-date="${d}" aria-pressed="${d === state.selectedDate}"><div class="d">${wd}, ${dm}</div><div class="s">${tag}${counts}</div></button>`;
    }).join('');
    document.querySelectorAll('.datebtn').forEach((b) => (b.onclick = () => { state.selectedDate = b.dataset.date; store.set('date', b.dataset.date); renderShows(); }));
  };

  const filters = () => ({
    q: $('#showSearch').value.trim().toLowerCase(),
    watchedOnly: $('#watchedOnly').checked,
    availOnly: $('#availOnly').checked,
    hotOnly: $('#hotOnly').checked,
  });
  ['#showSearch', '#watchedOnly', '#availOnly', '#hotOnly'].forEach((id) => $(id).addEventListener('input', () => renderShows()));

  const renderShows = () => {
    renderVenues();
    renderDates();
    const snap = snapFor(state.selectedDate);
    const statsEl = $('#stats'), moviesEl = $('#movies');
    if (!snap) {
      statsEl.innerHTML = '';
      moviesEl.innerHTML = `<div class="empty"><b>No data for this date yet</b>The watcher hasn't polled this venue and date yet — it should appear within a round or two.</div>`;
      return;
    }
    const f = filters();
    const shows = snap.shows.filter((s) =>
      (!f.watchedOnly || s.watched) && (!f.availOnly || seatState(s) === 'mid') && (!f.hotOnly || s.priority) &&
      (!f.q || [s.movie, s.eventName, s.dimension, s.screen, s.attributes, s.time].join(' ').toLowerCase().includes(f.q)));
    const watched = snap.shows.filter((s) => s.watched);
    statsEl.innerHTML = [
      ['Shows', `${watched.length}<small> watched / ${snap.shows.length}</small>`],
      ['Middle seats', `${watched.filter((s) => seatState(s) === 'mid').length}<small> shows · ${watched.reduce((n, s) => n + (seatInfo(s)?.middleFree || 0), 0)} seats</small>`],
      ['🔥 Priority', `${watched.filter((s) => s.priority).length}`],
      ['Fetched', `<span data-ago="${snap.fetchedAt}">${ago(snap.fetchedAt)}</span>`],
    ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

    if (snap.status !== 'open') {
      moviesEl.innerHTML = `<div class="empty"><b>${snap.status === 'venue_down' ? 'Venue is marked down' : 'Bookings not open yet'}</b>You'll get a Telegram alert the moment this date opens. <a href="${esc(snap.bookingUrl)}" target="_blank" rel="noopener">Open page ↗</a></div>`;
      return;
    }
    if (!shows.length) {
      moviesEl.innerHTML = `<div class="empty"><b>Nothing matches</b>Try clearing the filters.</div>`;
      return;
    }

    const byMovie = new Map();
    for (const s of shows) {
      if (!byMovie.has(s.movie)) byMovie.set(s.movie, new Map());
      const fm = byMovie.get(s.movie);
      if (!fm.has(s.eventCode)) fm.set(s.eventCode, []);
      fm.get(s.eventCode).push(s);
    }
    moviesEl.innerHTML = [...byMovie].map(([movie, formats]) => {
      const all = [...formats.values()].flat();
      const av = all.filter((s) => seatState(s) === 'mid').length;
      return `<article class="movie"><h2>${esc(movie)} <span class="sub">${all.length} show${all.length === 1 ? '' : 's'} · ${av} with middle seats</span></h2>` +
        [...formats.values()].map((list) => {
          const s0 = list[0];
          const hot = list.some((s) => s.priority);
          list.sort((a, b) => a.showDateTime.localeCompare(b.showDateTime));
          return `<div class="fmt"><div class="fmt-head"><span class="name">${esc(s0.eventName)}</span><span class="badge ${hot ? 'hot' : ''}">${esc(s0.dimension || '—')}</span></div><div class="chips">` +
            list.map((s) => {
              const k = showKey(s);
              const st = seatState(s), r = seatInfo(s);
              const cls = ['chip', { mid: 'avail', edge: 'edge', pending: 'pending', unknown: 'pending' }[st] || '', s.priority ? 'hot' : '', state.changed.has(k) ? 'flash' : '', state.fresh.has(k) ? 'new' : ''].join(' ');
              const line = st === 'mid' ? `${r.middleFree} middle · ${r.totalFree} free`
                : st === 'edge' ? `front/side only · ${r.totalFree} free`
                : st === 'full' ? 'no seats left'
                : st === 'pending' ? 'checking seats…'
                : st === 'unknown' ? `layout unknown · ${r.totalFree} free` : 'not bookable';
              const title = { mid: 'Middle seats available', edge: 'Seats only at the front or sides', full: 'Sold out', pending: 'Bookable; seat map not checked yet', unknown: "Hall direction not known yet, so middle seats aren't claimed", off: 'Not available' }[st];
              return `<button class="${cls}" data-k="${esc(k)}" title="${title}"><div class="t">${esc(s.time)}</div><div class="sc">${esc([s.screen, s.attributes].filter(Boolean).join(' · '))}</div><div class="seatline">${line}</div></button>`;
            }).join('') + `</div></div>`;
        }).join('') + `</article>`;
    }).join('');
    moviesEl.querySelectorAll('.chip').forEach((c) => (c.onclick = () => openShow(c.dataset.k)));
  };

  const openShow = (k) => {
    const snap = snapFor(state.selectedDate);
    const s = snap?.shows.find((x) => showKey(x) === k);
    if (!s) return;
    const cats = s.categories?.length
      ? `<table class="cats"><thead><tr><th>Class</th><th>Price</th><th>Status</th></tr></thead><tbody>${s.categories.map((c) => `<tr><td>${esc(c.name)}</td><td>₹${esc(c.price)}</td><td>${c.availStatus === '1' ? '<span class="tag open">available</span>' : '<span class="tag closed">not available</span>'}</td></tr>`).join('')}</tbody></table>`
      : '';
    openDrawer(`${s.time} · ${s.screen}`, `
      <dl class="kv">
        <dt>Movie</dt><dd>${esc(s.movie)}</dd>
        <dt>Event</dt><dd>${esc(s.eventName)}</dd>
        <dt>Format</dt><dd>${esc(s.dimension)} ${s.priority ? '🔥' : ''}</dd>
        <dt>Screen</dt><dd>${esc([s.screen, s.attributes].filter(Boolean).join(' · '))}</dd>
        <dt>Status</dt><dd>${{ mid: '✅ Middle seats free', edge: '🟠 Front / side seats only', full: '⛔ Sold out', pending: '⏳ Bookable — seat map not checked yet', unknown: '❔ Hall direction not known yet', off: '⛔ Not available' }[seatState(s)]}</dd>
        <dt>Session</dt><dd><code>${esc(s.sessionId)}</code> · <code>${esc(s.eventCode)}</code></dd>
        <dt>Book</dt><dd><a href="${esc(snap.bookingUrl)}" target="_blank" rel="noopener">Open booking page ↗</a></dd>
      </dl>
      ${hallHtml(s)}
      <div class="meta" style="margin-bottom:4px">Seat classes</div>${cats || '<div class="meta">No class data</div>'}
      <div class="meta" style="margin-bottom:4px">Raw</div><pre class="json">${highlight(s)}</pre>`, null);
  };

  const hallHtml = (s) => {
    const r = seatInfo(s);
    if (!r) return s.availStatus === '0' ? '' : '<div class="meta" style="margin-bottom:12px">Seat map not checked yet — it is read every few minutes.</div>';
    const byRow = new Map(r.rows.map((x) => [x.row, x]));
    const good = new Set(r.goodRows);
    const tpl = state.layouts[`${s.venue}:${s.screen}`.toUpperCase()];
    if (tpl) return templateHall(s, r, tpl, byRow, good);
    const rowsBackToFront = [...r.hallRows].reverse();
    const lines = rowsBackToFront.map((row) => {
      const x = byRow.get(row);
      const sts = x
        ? x.seats.map((st) => `<span class="st ${st.free ? (st.middle ? 'm' : 'f') : ''}" title="${esc(row + st.n)}${st.free ? (st.middle ? ' · middle, free' : ' · free') : ' · booked'}"></span>`).join('')
        : '<span class="full" title="Fully booked"></span>';
      return `<div class="hrow ${good.has(row) ? 'good' : ''}"><span class="lbl">${esc(row)}</span><div class="sts">${sts}</div><span class="lbl">${x ? x.free : 0}</span></div>`;
    }).join('');
    const summary = `<dl class="kv"><dt>Free seats</dt><dd>${r.totalFree}</dd><dt>Middle free</dt><dd>${r.middleFree} (best block of ${r.bestBlock} together)</dd><dt>Middle rows</dt><dd>${esc(r.goodRows.join(' ') || '—')}</dd><dt>Checked</dt><dd><span data-ago="${esc(r.checkedAt)}">${ago(r.checkedAt)}</span></dd></dl>`;
    const vn = esc(snapFor(s.date)?.venueName || s.venue);
    const note = r.layoutSource === 'unknown'
      ? `<div class="note">Can't tell which end of ${esc(s.screen)} faces the screen yet, so no seats are counted as middle. Add <code>screens["${esc(s.screen)}"].rows</code> for ${vn} in config.json (screen → back, e.g. "A-N" or "N-A").</div>`
      : r.layoutSource === 'detected'
        ? `<div class="note">Hall direction read from the site's seat map; rows ${esc(r.hallRows[0] || '')} (screen) → ${esc(r.hallRows[r.hallRows.length - 1] || '')} (back).</div>`
        : '';
    return `<div class="meta" style="margin-bottom:4px">Seats as seen facing the screen (screen at the bottom; filled = free middle seat, outlined = other free seat)</div><div class="hall">${lines}<div class="screenbar"></div><div class="screenlbl">SCREEN</div></div>${note}${summary}`;
  };

  /** Draw the hall exactly like the site: same columns, aisles and gap rows. */
  const templateHall = (s, r, tpl, byRow, good) => {
    const seatSize = Math.max(6, Math.min(12, Math.floor(500 / (tpl.cols + 4))));
    const cells = [];
    for (const tr of tpl.rows) {
      const live = byRow.get(tr.row);
      const stateOf = new Map((live?.seats || []).map((x) => [x.n, x]));
      const line = tr.line + 1;
      cells.push(`<span class="lbl ${good.has(tr.row) ? 'good' : ''}" style="grid-row:${line};grid-column:1">${esc(tr.row)}</span>`);
      for (const seat of tr.seats) {
        const x = stateOf.get(seat.n);
        const cls = x && x.free ? (x.middle ? 'm' : 'f') : '';
        const tip = `${tr.row}${seat.n}${x && x.free ? (x.middle ? ' · middle, free' : ' · free') : ' · booked'}`;
        cells.push(`<span class="st ${cls}" style="grid-row:${line};grid-column:${seat.col + 2}" title="${esc(tip)}"></span>`);
      }
      cells.push(`<span class="lbl ${good.has(tr.row) ? 'good' : ''}" style="grid-row:${line};grid-column:${tpl.cols + 2}">${live ? live.free : 0}</span>`);
    }
    const grid = `<div class="hallgrid" style="grid-template-columns:14px repeat(${tpl.cols}, ${seatSize}px) 18px;grid-template-rows:repeat(${tpl.lines}, ${seatSize}px)">${cells.join('')}</div>`;
    const summary = `<dl class="kv"><dt>Free seats</dt><dd>${r.totalFree}</dd><dt>Middle free</dt><dd>${r.middleFree} (best block of ${r.bestBlock} together)</dd><dt>Middle rows</dt><dd>${esc(r.goodRows.join(' ') || '—')}</dd><dt>Checked</dt><dd><span data-ago="${esc(r.checkedAt)}">${ago(r.checkedAt)}</span></dd></dl>`;
    return `<div class="meta" style="margin-bottom:4px">Seats exactly as on the site's map (screen at the bottom; filled = free middle seat, outlined = other free seat)</div><div class="hall">${grid}<div class="screenbar"></div><div class="screenlbl">SCREEN</div></div>${summary}`;
  };

  // ---------- drawer ----------
  const openDrawer = (title, html, key) => {
    state.drawerKey = key;
    $('#drawerTitle').textContent = title;
    $('#drawerBody').innerHTML = html;
    $('#drawer').classList.add('open'); $('#scrim').classList.add('open');
    $('#drawer').setAttribute('aria-hidden', 'false');
  };
  const closeDrawer = () => {
    state.drawerKey = null;
    $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open');
    $('#drawer').setAttribute('aria-hidden', 'true');
    document.querySelectorAll('tbody tr.sel').forEach((r) => r.classList.remove('sel'));
  };
  $('#drawerClose').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;
  addEventListener('keydown', (e) => e.key === 'Escape' && closeDrawer());

  const highlight = (v) => esc(JSON.stringify(v, null, 2))
    .replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)/g, '<span class="j-k">$1</span>$2')
    .replace(/:\s(&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, ': <span class="j-s">$1</span>')
    .replace(/:\s(-?\d+(?:\.\d+)?)/g, ': <span class="j-n">$1</span>')
    .replace(/:\s(true|false)/g, ': <span class="j-b">$1</span>')
    .replace(/:\s(null)/g, ': <span class="j-z">$1</span>');

  // ---------- redis ----------
  const keyLabel = (k) => {
    const parts = k.split(':');
    return parts.map((p, i) => (i === parts.length - 1 ? `<b>${esc(p)}</b>` : `<span class="kseg">${esc(p)}</span>`)).join('<span class="kseg">:</span>');
  };
  const renderKeys = () => {
    const q = $('#keyFilter').value.trim().toLowerCase();
    const rows = state.keys.filter((k) => !q || k.key.toLowerCase().includes(q) || k.preview.toLowerCase().includes(q));
    $('#keyCount').textContent = state.keys.length ? String(state.keys.length) : '';
    $('#keysBody').innerHTML = rows.length ? rows.map((k) =>
      `<tr data-k="${esc(k.key)}" class="${state.changedKeys.has(k.key) ? 'flash' : ''} ${state.drawerKey === k.key ? 'sel' : ''}"><td class="key">${keyLabel(k.key)}</td><td class="type"><span class="badge">${esc(k.type)}</span></td><td class="ttl">${ttlText(k.ttlMs)}</td><td class="val">${esc(k.preview)}</td></tr>`).join('')
      : `<tr><td colspan="4" class="meta" style="text-align:center;padding:28px">No keys match</td></tr>`;
    $('#keysBody').querySelectorAll('tr[data-k]').forEach((tr) => (tr.onclick = () => openKey(tr.dataset.k)));
  };
  $('#keyFilter').addEventListener('input', renderKeys);

  const loadKeys = async () => {
    const pattern = $('#pattern').value.trim() || 'fdfs:*';
    try {
      const r = await fetch('/api/keys?pattern=' + encodeURIComponent(pattern));
      const data = await r.json();
      const changed = new Set();
      for (const k of data.keys) {
        const h = k.type + '|' + k.size + '|' + k.preview;
        const prev = state.keyHashes.get(k.key);
        if (state.keyHashes.size && prev !== h) changed.add(k.key);
        state.keyHashes.set(k.key, h);
      }
      state.changedKeys = changed;
      state.keys = data.keys;
      $('#keysMeta').textContent = `${data.keys.length}${data.truncated ? '+' : ''} keys · ${new Date().toLocaleTimeString()}`;
      renderKeys();
      if (state.drawerKey && changed.has(state.drawerKey)) openKey(state.drawerKey);
    } catch (e) {
      $('#keysMeta').textContent = 'failed: ' + e.message;
    }
  };
  const loadKeysSoon = debounce(loadKeys, 400);
  $('#reloadKeys').onclick = () => { state.keyHashes.clear(); loadKeys(); };
  $('#pattern').addEventListener('keydown', (e) => e.key === 'Enter' && (state.keyHashes.clear(), loadKeys()));

  const openKey = async (key) => {
    const r = await fetch('/api/key?k=' + encodeURIComponent(key));
    const data = await r.json();
    if (!r.ok) return toast(data.error || 'failed');
    openDrawer(key, `<dl class="kv"><dt>Type</dt><dd>${esc(data.type)}</dd><dt>TTL</dt><dd>${ttlText(data.ttlMs)}</dd></dl><pre class="json">${highlight(data.value)}</pre>`, key);
    document.querySelectorAll('tbody tr').forEach((tr) => tr.classList.toggle('sel', tr.dataset.k === key));
  };

  // ---------- alerts ----------
  const kindLabel = { new_show: 'NEW SHOW', avail_up: 'SEATS', date_open: 'OPEN', middle_seats: '🎯 MIDDLE' };
  const renderAlerts = () => {
    $('#alertCount').textContent = state.alerts.length ? String(state.alerts.length) : '';
    $('#alertsList').innerHTML = state.alerts.length ? state.alerts.map((a) => {
      const { wd, dm } = prettyDate(a.date);
      return `<li><b class="k-${esc(a.kind)}">${a.priority ? '🔥 ' : ''}${kindLabel[a.kind] || esc(a.kind)}</b><span>${a.venueName ? `<b>${esc(a.venueName)}</b> · ` : ''}${esc(a.summary)} <span class="meta">· ${wd} ${dm}</span></span><span class="when" title="${esc(a.at)}">${new Date(a.at).toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' })}</span></li>`;
    }).join('') : `<li style="display:block;text-align:center;color:var(--muted);padding:32px">No alerts yet. They'll appear here as they're sent to Telegram.</li>`;
  };

  // ---------- data ----------
  const loadState = async () => {
    const r = await fetch('/api/state');
    const data = await r.json();
    const changed = new Set(), fresh = new Set();
    const hadPrev = state.prevShows.size > 0;
    for (const snap of data.snapshots) {
      for (const s of snap.shows) {
        const k = showKey(s);
        const prev = state.prevShows.get(k);
        if (hadPrev && prev === undefined) fresh.add(k);
        else if (hadPrev && prev !== s.availStatus) changed.add(k);
        state.prevShows.set(k, s.availStatus);
      }
    }
    for (const snap of data.snapshots) {
      for (const s of snap.shows) {
        const k = showKey(s);
        const r = s.availStatus === '0' ? null : data.seats?.[k];
        const st = r ? (r.middleOk ? 'mid' : r.totalFree ? 'edge' : 'full') : '';
        const prev = state.prevMiddle.get(k);
        if (prev !== undefined && prev !== st && st) changed.add(k);
        state.prevMiddle.set(k, st);
      }
    }
    state.changed = changed;
    for (const k of fresh) state.fresh.add(k);
    state.status = data.status;
    state.snapshots = data.snapshots;
    state.seats = data.seats || {};
    state.layouts = data.layouts || {};
    state.alerts = data.alerts;
    renderStatus(); renderShows(); renderAlerts();
  };
  const loadStateSoon = debounce(() => loadState().catch(() => {}), 250);

  // ---------- live stream ----------
  const connect = () => {
    const es = new EventSource('/api/events');
    const pill = $('#streamPill');
    es.onopen = () => { pill.className = 'pill ok'; pill.lastElementChild.textContent = 'Stream'; loadStateSoon(); };
    es.onerror = () => { pill.className = 'pill bad'; pill.lastElementChild.textContent = 'Reconnecting'; };
    es.onmessage = (e) => {
      let ev; try { ev = JSON.parse(e.data); } catch { return; }
      if (ev.type === 'status') { state.status = ev.status; renderStatus(); }
      if (ev.type === 'snapshot' || ev.type === 'seats') {
        loadStateSoon();
        if (state.tab === 'redis' && $('#liveKeys').checked) loadKeysSoon();
      }
      if (ev.type === 'alert') {
        toast((ev.entry.priority ? '🔥 ' : '') + (ev.entry.venueName ? ev.entry.venueName + ' · ' : '') + ev.entry.summary);
        loadStateSoon();
      }
    };
  };

  setInterval(() => {
    renderStatus();
    document.querySelectorAll('[data-ago]').forEach((el) => (el.textContent = ago(el.dataset.ago)));
  }, 1000);

  setTab(state.tab);
  loadState().catch((e) => { $('#movies').innerHTML = `<div class="empty"><b>Can't reach the dashboard API</b>${esc(e.message)}</div>`; });
  connect();
})();
</script>
</body>
</html>
